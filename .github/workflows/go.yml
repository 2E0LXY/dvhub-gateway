name: Go verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Validate deployment helpers
        run: |
          bash -n deploy/gitops/dvhub-deploy deploy/gitops/install.sh \
            deploy/gitops/migrate-caddy-to-unix-socket \
            deploy/allstar/dvhub-configure-allstar-node \
            deploy/allstar/dvhub-allstar-status \
            deploy/allstar/dvhub-allstar-control \
            deploy/allstar/dvhub-echolink-status \
            deploy/m17/install-m17.sh \
            deploy/dvhub-service-control \
            deploy/xlxd/install-xlxd.sh
          python3 -m py_compile \
            deploy/allstar/dvhub-configure-echolink \
            deploy/dvhub-set-conference-credential
          python3 -m py_compile deploy/m17/configure-asl-m17.py
          sudo visudo -cf deploy/allstar/dvhub-allstar.sudoers
          sudo visudo -cf deploy/dvhub-gateway.sudoers
      - name: Validate dashboard JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("dashboard.html").read_text(encoding="utf-8")
          scripts = [
              match.group(1)
              for match in re.finditer(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
              if match.group(1).strip()
          ]
          if len(scripts) != 1:
              raise SystemExit(f"expected one inline dashboard script, found {len(scripts)}")
          Path("/tmp/dvhub-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/dvhub-dashboard.js
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
