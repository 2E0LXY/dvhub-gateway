# Yorkshire Link M17 reflector runtime configuration.
# M17-YLH module A is the M17 presentation of conference TG23530.
Callsign = M17-YLH
Modules = A
ListenOnlyAllowEncrypt = false

IPv4BindAddr = 0.0.0.0
Port = 17000

PidPath = /run/mrefd/mrefd.pid
JsonPath = /var/log/mrefd/mrefd.json
WhitelistPath = /etc/mrefd/mrefd.whitelist
BlacklistPath = /etc/mrefd/mrefd.blacklist
InterlinkPath = /etc/mrefd/mrefd.interlink
