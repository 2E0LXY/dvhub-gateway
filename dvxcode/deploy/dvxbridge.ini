[general]
callsign    = 2E0LXY          ; D-STAR gateway callsign / HBP peer callsign
dmrids      = /var/lib/dvxbridge/DMRIds.dat
latitude    = 53.68
longitude   = -1.50
location    = Wakefield
url         = https://github.com/2E0LXY/dvxcode
lowlatency  = 0               ; 1 = drop 20 ms lookahead (less pitch repair)

[dmr]
master      = 2341.master.brandmeister.network:62031
id          = 235199901       ; peer ID registered with the master
password    = changeme
talkgroup   = 235
slot        = 2
colourcode  = 1
fallbackid  = 235199901       ; source ID for D-STAR calls with no DMR ID
; options   = TS2=235;        ; RPTO string (BrandMeister static TGs etc.)

[dstar]
reflector   = xlx235.example.org:30001
module      = C               ; reflector module
localmodule = B
suffix      = DMR

[idoverride]
; M0ABC = 2341234             ; force a callsign to an ID
